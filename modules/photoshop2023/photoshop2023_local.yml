# import local photoshop archive file, you should download it manually if you want to use this module

name: photoshop
buildsystem: simple
sources:
  - type: archive
    dest: Adobe
    path: commonfiles_adobe_2023.zip
    sha256: eb52e9e634f8aa0647374124dd26cdb1d2f4e65c3bf004f23e6d4cad452fdf6a
    strip-components: 0
  - type: archive
    dest: photoshop2023
    path: photoshop2023.zip
    sha256: 57587ae8973d0cba7bfdd93aca80c6f9dd9fb6d902b7ded39dc7bff664f60ca4
    strip-components: 0
build-commands:
  - ls Adobe
  - cp -r Adobe /app/Adobe
  - ls /app/Adobe
  - cp -r photoshop2023 /app/photoshop2023

